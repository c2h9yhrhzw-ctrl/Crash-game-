
services:
  - type: web
    name: crash-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: STARTING_VIRTUAL_CREDITS
        value: "1000"
      - key: ROUND_BETTING_MS
        value: "8000"
      - key: ROUND_TICK_MS
        value: "100"
